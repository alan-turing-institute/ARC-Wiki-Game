
experiments:
  step_list:
    agent_class: GreedyEmbeddingAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - all-distilroberta-v1
      - average_word_embeddings_glove.6B.300d
      - all-MiniLM-L6-v2
      - paraphrase-albert-small-v2
      - all-mpnet-base-v2
      - all-roberta-large-v1
      - distiluse-base-multilingual-cased-v1
      - stsb-xlm-r-multilingual
      - paraphrase-multilingual-mpnet-base-v2
      - paraphrase-multilingual-MiniLM-L12-v2
      - distiluse-base-multilingual-cased-v2
      - jinaai/jina-embeddings-v2-base-zh
      - intfloat/multilingual-e5-large
      - intfloat/multilingual-e5-small
    params:
      max_rounds: 100

  step_list_prompt_v2:
    agent_class: PromptAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - wikigame-gpt-4o
    params:
      llm: gpt
      max_rounds: 100
      temperature: 0
      top_p: 0.1
      manual_seed: 42
      num_retries: 5
      max_titles: 500

  step_list_titles:
    agent_class: GreedyEmbeddingAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - all-distilroberta-v1
      - average_word_embeddings_glove.6B.300d
      - all-MiniLM-L6-v2
      - paraphrase-albert-small-v2
      - all-mpnet-base-v2
      - all-roberta-large-v1
      - distiluse-base-multilingual-cased-v1
      - stsb-xlm-r-multilingual
      - paraphrase-multilingual-mpnet-base-v2
      - paraphrase-multilingual-MiniLM-L12-v2
      - distiluse-base-multilingual-cased-v2
      - intfloat/multilingual-e5-large
      - intfloat/multilingual-e5-small
    params:
      max_rounds: 100
      use_titles: True

  step_list_tfidf_tuning_1000:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 1000

  step_list_tfidf_tuning_10000:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 10000

  step_list_tfidf_tuning_100000:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 100000

  step_list_tfidf_tuning_200000:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 200000

  step_list_tfidf_tuning_1000000:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 1000000

  step_list_tfidf_openalex_corpus:
    agent_class: TFIDFAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 100000
    agent_tools_for_corpus: oa_physics
    params_for_corpus:
      from_database: True


  step_list_prompt_llama:
    agent_class: PromptAgent
    game_datasets:
      - en_wiki_step_list
    models:
      - llama3.2:latest
    params:
      llm: ollama
      max_rounds: 100
      temperature: 0
      top_p: 0.1
      manual_seed: 42
      num_retries: 5
      max_titles: 200
