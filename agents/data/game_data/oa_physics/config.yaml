experiments:
  step_list_en:
    agent_class: GreedyEmbeddingAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - all-distilroberta-v1
      - average_word_embeddings_glove.6B.300d
      - all-MiniLM-L6-v2
      - paraphrase-albert-small-v2
      - all-mpnet-base-v2
      - all-roberta-large-v1
      - distiluse-base-multilingual-cased-v1
      - stsb-xlm-r-multilingual
      - paraphrase-multilingual-mpnet-base-v2
      - paraphrase-multilingual-MiniLM-L12-v2
      - distiluse-base-multilingual-cased-v2
      - intfloat/multilingual-e5-large
      - intfloat/multilingual-e5-small
    params:
      max_rounds: 100
      filter_lang: en
      from_database: True

  step_list_tfidf_wiki_corpus:
    agent_class: TFIDFAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 100000
    agent_tools_for_corpus: en_wiki
    params_for_corpus:
      from_database: False

  step_list_tfidf_openalex_corpus:
    agent_class: TFIDFAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - tfidf
    params:
      max_rounds: 100
      lang: en
      manual_seed: 42
      max_articles: 100000

  step_list_prompt_mini:
    agent_class: PromptAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - wikigame-gpt-4o-mini
    params:
      llm: gpt
      max_rounds: 100
      temperature: 0
      top_p: 0.1
      manual_seed: 42
      num_retries: 5
      max_titles: 500
      filter_lang: en
      from_database: True

  step_list_prompt_small:
    agent_class: PromptAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - llama3.2:3b
    params:
      llm: ollama
      max_rounds: 100
      temperature: 0
      top_p: 0.1
      manual_seed: 42
      num_retries: 5
      max_titles: 200
      filter_lang: en
      from_database: True

  step_list_prompt_large:
    agent_class: PromptAgent
    game_datasets:
      - oa_physics_step_list_lang
    models:
      - llama3.1:405b
    params:
      llm: ollama
      max_rounds: 100
      temperature: 0
      top_p: 0.1
      manual_seed: 42
      num_retries: 5
      max_titles: 200
      filter_lang: en
      from_database: True
