
experiments:
  initial_test_100:
    agent_class: GreedyEmbeddingAgent
    game_datasets:
      - wikipedia_test_100
    models:
      - all-distilroberta-v1
      - average_word_embeddings_glove.6B.300d
      - all-MiniLM-L6-v2
      - paraphrase-albert-small-v2
      - all-mpnet-base-v2
      - all-roberta-large-v1
    params:
      max_rounds: 50

  prompt_test_10:
    agent_class: PromptAgent
    game_datasets:
      - wikipedia_test_10
    models:
      - wikigame-gpt-4o
    params:
      max_rounds: 50
      temperature: 0
      seed: 42

  prompt_test_100:
    agent_class: PromptAgent
    game_datasets:
      - wikipedia_test_100
    models:
      - wikigame-gpt-4o
    params:
      max_rounds: 50

  initial_test_1000:
    agent_class: GreedyEmbeddingAgent
    game_datasets:
      - wikipedia_test_1000
    models:
      - average_word_embeddings_glove.6B.300d
      - all-MiniLM-L6-v2
    params:
      max_rounds: 50
